<svg xmlns="http://www.w3.org/2000/svg" width="112" height="72" viewBox="0 0 112 72" role="img" aria-label="Melzi product mark with Castor signature"><title>Melzi product mark with Castor signature</title><style>:root{--ink:#14130f;--paper:#ffffff;--human:#c4552a;--quiet:#4d493f}@media(prefers-color-scheme:dark){:root{--ink:#e9e6df;--paper:#0d1117;--human:#c4552a;--quiet:#bdb8b0}}.castor-motion{transform-box:fill-box;transform-origin:center;animation:signature-turn 9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes signature-turn{0%,10%,30%,100%{transform:rotate(0deg)}17%,23%{transform:rotate(90deg)}}
.pen{transform-box:view-box;transform-origin:18px 47px;animation:pen-rock 9s ease-out infinite}
@keyframes pen-rock{0%,10%,30%,100%{transform:rotate(0deg)}17%{transform:rotate(-4deg)}23%{transform:rotate(1deg)}}
.cell-fill{animation:cell-focus 9s ease-in-out infinite}
@keyframes cell-focus{0%,10%,30%,100%{opacity:.12}17%,23%{opacity:.3}}
.sample-cursor{opacity:0;animation:sample-read 9s linear infinite}
@keyframes sample-read{0%,10%,30%,100%{opacity:0;transform:translateX(0)}12%{opacity:.32;transform:translateX(0)}25%{opacity:.32;transform:translateX(51px)}27%{opacity:0;transform:translateX(51px)}}
@media(prefers-reduced-motion:reduce){.castor-motion,.pen,.cell-fill,.sample-cursor{animation:none!important}.sample-cursor{opacity:0}.cell-fill{opacity:.12}}
</style><g transform="translate(2 6)"><g color="var(--ink)"><path id="folio" d="M7 7H46L59 20V59H7ZM46 7V20H59" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><g class="pen" id="pen"><path id="nib" d="M18 47 22 29 37 19 47 29 36 43Z" fill="currentColor"/><path id="nib-slit" d="M18 47 33 32" fill="none" stroke="var(--paper)" stroke-width="2.2"/><circle id="nib-eye" cx="34" cy="31" r="2.6" fill="var(--paper)"/></g><path id="writing" d="M16 53H40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></g><g color="var(--ink)"></g></g><g class="castor-motion" id="castor-motion"><image id="castor-badge" x="82" y="5" width="21.56000" height="21.56000" href="data:image/svg+xml;base64,"/></g></svg>
