name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  types:
    name: TypeScript and generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:typescript
  behavior:
    name: Launcher and provider behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: node --test tests/cli-shim.test.mjs
      - run: bun test tests/lib/transformers tests/build.test.js tests/hook-build.test.mjs
  privacy:
    name: Package surface privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/check-package-privacy.mjs
