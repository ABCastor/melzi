name: Verify Generated Provider Output

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "cli/engine/**"
      - "skill/**"
      - "scripts/**"
      - "docs/CURSOR-PLUGIN.md"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-generated-output
  cancel-in-progress: false

env:
  GENERATED_PATHS: >-
    .agent
    .agents
    .dsh
    .gemini
    .github/agents
    .github/hooks
    .github/skills
    .grok
    .hermes
    .kiro
    .opencode
    .pi
    .qoder
    .rovodev
    .trae
    .trae-cn
    .veto
    .vibe
    plugin
    cursor-plugin

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release output
        run: bun run build:release

      - name: Check generated output drift
        id: drift
        run: |
          changes="$(git status --porcelain -- $GENERATED_PATHS)"
          if [ -z "$changes" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated provider output drift."
          else
            echo "::error::Generated provider output differs. Rebuild and include the result in a reviewed commit."
            printf '%s\n' "$changes"
            exit 1
          fi
