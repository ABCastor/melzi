name: Preview PR Triage

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Preview triage without changing issues or pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/github/sheriff.mjs --dry-run \
            --repo "$GITHUB_REPOSITORY" \
            --warning-days 7 \
            --close-days 14 \
            --maintainers "Anneo22" \
            --regular-contributors "Anneo22,dependabot[bot]"
