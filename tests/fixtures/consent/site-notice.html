<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent hiding: a notice the site wrote itself</title>
  <style>
    /* A cookie notice the site wrote itself: generic class names ("cookie",
       "consent", "banner"), no known vendor. It is part of the site, so the
       URL engine leaves it on the page: the copy it covers is not scored and
       its own faint text is. Pinned by crates/browser/tests/consent_hiding.rs. */
    * { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 40px; color: #111; background: #fff; }
    .faint { position: absolute; top: 700px; left: 80px; width: 520px; margin: 0; font-size: 14px; line-height: 28px; color: #aaaaaa; }
    .cta { position: absolute; top: 740px; left: 80px; display: inline-block; padding: 8px 16px; border-radius: 6px;
      background: #ff7145; color: #ffffff; font-size: 15px; font-weight: 500; text-decoration: none; }
    .cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; height: 170px; padding: 24px 40px;
      background: #ffffff; border-top: 1px solid #d0d7de; z-index: 50; }
    .cookie-banner p { margin: 0 0 12px; max-width: 760px; font-size: 14px; color: #b0b0b0; }
  </style>
</head>
<body>
  <h1>A page under the site's own cookie notice</h1>
  <p class="faint" id="covered-copy">Faint copy the site's notice covers.</p>
  <a href="#" class="cta" id="covered-cta">Start free trial</a>
  <div class="cookie-banner" id="cookie-consent" data-cookie-consent="true">
    <p id="notice-text">We use cookies to keep you signed in and to count visits.</p>
    <button type="button">Accept</button>
  </div>
</body>
</html>
