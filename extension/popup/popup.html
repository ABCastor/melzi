<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/kinpaku.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="ks-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="currentColor">
        <path d="M7 1 L18 1 L8 31 L7 31 Q1 31 1 25 L1 7 Q1 1 7 1 Z"/>
        <path d="M22 1 L25 1 Q31 1 31 7 L31 25 Q31 31 25 31 L12 31 Z"/>
      </svg>
    </span>
    <h1>Melzi</h1>
  </header>

  <div class="count-display" id="count-display">
    <span class="count-number" id="count-number">0</span>
    <span class="count-label" id="count-label">anti-patterns</span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-scan">Scan page</button>
    <button class="btn btn-secondary" id="btn-toggle">Hide overlays</button>
  </div>

  <p class="scan-error" id="scan-error" hidden></p>

  <section class="design-lab-card" aria-labelledby="design-lab-title">
    <div class="design-lab-head">
      <h2 id="design-lab-title">Design Lab</h2>
      <span class="design-lab-state" id="design-lab-state">Off</span>
    </div>
    <p>Comment, capture, and test palettes or font pairings on this page.</p>
    <button class="btn btn-lab" id="btn-design-lab" type="button" aria-pressed="false">
      Turn Design Lab on
    </button>
    <p class="scan-error design-lab-error" id="design-lab-error" hidden></p>
  </section>

  <footer>
    <span id="link-site">Melzi</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
